name: Build C-API

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 6'
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag to attach the built archives to. Artifacts only when empty.'
        type: string
        required: false
        default: ''
      version:
        description: 'Version string used in the archive file names.'
        type: string
        required: false
        default: 'dev'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: [linux-x86, linux-arm-aarch64, linux-arm-v7, macos-x86, macos-aarch64, win-x86]
        include:
          - build: linux-x86
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - build: linux-arm-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # armv7 has no hosted runner, so it stays cross-compiled.
          - build: linux-arm-v7
            os: ubuntu-22.04
            target: armv7-unknown-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            cargoc-feat: '--features=vendored-openssl'
          - build: macos-x86
            os: macos-15-intel
            target: x86_64-apple-darwin
          - build: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          # No aarch64-pc-windows-msvc: tract-linalg's build script only has an MSVC path for
          # x86_64. On aarch64 it hands GNU-syntax assembly to the MSVC toolchain, the objects are
          # never produced and lib.exe fails with LNK1181.
          - build: win-x86
            os: windows-2022
            target: x86_64-pc-windows-msvc
            cargoc-feat: '--features=vendored-openssl'
            cinstall-args: '--crt-static'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          cache-on-failure: true

      - name: Install gcc-arm-linux-gnueabihf
        if: ${{ matrix.target == 'armv7-unknown-linux-gnueabihf' }}
        run: |
          mkdir -p .cargo
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-arm-linux-gnueabihf crossbuild-essential-armhf
          echo -e "[target.${{ matrix.target }}]\nlinker=\"${{ matrix.cc }}\"\n" > .cargo/config.toml

      - name: Setup target
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV

      - name: Install Perl on Windows
        if: ${{ runner.os == 'Windows' }}
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.34'

      - name: Install cargo-c and cbindgen
        run: |
          cargo install cargo-c ${{ matrix.cargoc-feat }}
          cargo install cbindgen

      # `capi` is not a default feature, so without it `mod capi` is never compiled
      # and the resulting library exports none of the df_* functions.
      - name: Build C-API library
        shell: bash
        run: |
          cargo cinstall --profile=release-lto -p deep_filter \
            --features capi \
            --destdir=${{ env.TARGET_DIR }} \
            ${{ matrix.cinstall-args }} \
            ${{ env.TARGET_FLAGS }}

      - name: Rebuild header using the settings in cbindgen.toml
        shell: bash
        run: |
          cbindgen --config cbindgen.toml --crate deep_filter --output ${{ env.TARGET_DIR }}/usr/local/include/deep_filter/deep_filter.h

      - name: Copy to staging
        shell: bash
        run: |
          mkdir staging
          mv ${{ env.TARGET_DIR }}/usr staging

      - name: List built files
        shell: bash
        run: find ./staging

      - name: Archive
        shell: bash
        run: |
          echo "DF_CAPI_NAME=deep_filter-capi-${{ inputs.version || 'dev' }}-${{ matrix.target }}" >> $GITHUB_ENV
          tar -czf "deep_filter-capi-${{ inputs.version || 'dev' }}-${{ matrix.target }}.tar.gz" -C staging .

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DF_CAPI_NAME }}
          path: ${{ env.DF_CAPI_NAME }}.tar.gz

      - name: Upload release archive
        if: ${{ inputs.release_tag != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber ${{ inputs.release_tag }} ${{ env.DF_CAPI_NAME }}.tar.gz
