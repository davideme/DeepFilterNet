name: Build DF Demo
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-df-output:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned, not nightly: the demo's GUI stack (iced 0.12 -> winit 0.29 ->
        # objc2 0.4.1) stopped compiling on rustc 1.102.0-nightly (2026-11-23,
        # E0277 in objc2's ivar_forwarding_impls.rs), which broke the macOS job
        # with no change in this repo. Nothing here needs nightly. 1.98.0 is
        # verified to build `df-demo --features ui`; bump it deliberately, and
        # expect 1.102+ to need an iced upgrade off objc2 0.4.
        include:
          - os: ubuntu-22.04
            rust: "1.98.0"
          - os: macos-15
            rust: "1.98.0"
          - os: windows-2022
            rust: "1.98.0"
            ext: .exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{matrix.rust}}
          components: 'rustfmt, clippy'
      - name: Install Alsa
        if: ${{ runner.os == 'linux' }}
        run: |
          sudo apt-get update && \
          sudo apt-get install libasound2-dev
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{matrix.rust}}-cargo-${{ hashFiles('**/Cargo.toml') }}
          cache-on-failure: true
      - name: Run cargo build
        shell: bash
        run: |
          cargo build -p df-demo --bin df-demo --features ui --release
      - uses: actions/upload-artifact@v7
        with:
          name: demo-build-artifact-${{runner.os}}
          path: target/release/df-demo${{matrix.ext}}
