name: Rust CI

on:
  # `branches` must be present, otherwise a bare `push:` also fires on tag pushes -- a release tag
  # would re-run the whole matrix against a commit already tested on the branch it came from.
  push:
    branches: ['**']
  schedule:
    - cron: '0 18 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - {command: fmt, rust: nightly, args: '--all -- --check', hdf5: false}
          - {command: clippy, rust: nightly, args: '-p df-demo --tests --all-features -- -D warnings', alsa: true}
          - {command: clippy, rust: nightly, args: '-p deep_filter --tests --all-features -- -D warnings', hdf5: true}
          - {command: test, rust: stable, args: '--all-features -p deep_filter', hdf5: true}
          - {command: build, rust: stable, args: '-p deep_filter', hdf5: false}
          - {command: build, rust: stable, args: '-p DeepFilterLib', hdf5: false}
          - {command: build, rust: stable, args: '-p DeepFilterDataLoader', hdf5: true}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: 'rustfmt, clippy'
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-${{ matrix.command }}-${{matrix.rust}}-cargo-${{ hashFiles('**/Cargo.toml') }}
          cache-on-failure: true
      - name: Install HDF5
        if: matrix.hdf5 == true
        run: |
          sudo apt-get update && \
          sudo apt-get install libhdf5-dev
      - name: Install HDF5
        if: matrix.alsa == true
        run: |
          sudo apt-get update && \
          sudo apt-get install libasound2-dev
      - name: Run cargo ${{matrix.command}}
        shell: bash
        run: |
          cargo ${{matrix.command}} ${{matrix.args}}
      - uses: actions/upload-artifact@v7
        if: matrix.command == 'test'
        with:
          name: test-artifacts
          path: out/

  # Build and test deep_filter on every target the C-API release ships for.
  # All six have hosted runners, so the test suite runs natively rather than cross-compiled.
  cross-platform:
    name: build+test ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
      # `wav-utils` is what the transforms tests read fixtures with; deliberately no `dataset`,
      # so no HDF5 toolchain is needed on any of the six runners.
      FEATURES: capi,wav-utils
    strategy:
      fail-fast: false
      matrix:
        build: [linux-x86, linux-aarch64, macos-x86, macos-aarch64, win-x86]
        include:
          - build: linux-x86
            os: ubuntu-22.04
          - build: linux-aarch64
            os: ubuntu-22.04-arm
          - build: macos-x86
            os: macos-15-intel
          - build: macos-aarch64
            os: macos-15
          # aarch64-pc-windows-msvc is absent on purpose: tract-linalg cannot build there.
          - build: win-x86
            os: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.build }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          cache-on-failure: true
      - name: Build
        run: cargo build -p deep_filter --features ${{ env.FEATURES }}
      - name: Test
        run: cargo test -p deep_filter --features ${{ env.FEATURES }}
