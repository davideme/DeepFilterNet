[package]
name = "DeepFilterLib"
version = "0.5.7-davideme.1"
authors = ["Hendrik Schröter"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "libdf"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
deep_filter = { features = ["transforms", "logging"], path = "../libDF" }
pyo3 = { version = "0.23", features = ["extension-module"]}
numpy = "0.23"
ndarray = "^0.16"
