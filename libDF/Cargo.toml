[package]
name = "deep_filter"
version = "0.5.7-rc.1"
authors = ["Hendrik Schröter"]
edition = "2021"
description = "Noise supression using deep filtering"
repository = "https://github.com/Rikorose/DeepFilterNet"
license = "MIT/Apache-2.0"
readme = "../README.md"
rust-version = "1.91"

[lib]
name = "df"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "sample-hdf5"
path = "src/bin/sample-hdf5.rs"
required-features = ["dataset", "bin"]

[[bin]]
name = "sample-dataset"
path = "src/bin/sample-dataset.rs"
required-features = ["dataset", "bin"]

[[bin]]
name = "deep-filter"
path = "src/bin/enhance_wav.rs"
required-features = ["bin", "tract", "wav-utils", "transforms"]

[[bench]]
name = "runtime"
path = "benches/runtime.rs"
harness = false
required-features = ["tract", "default-model"]

[features]
default = ["default-model", "vorbis", "flac"]

transforms = ["dep:thiserror", "dep:ndarray", "dep:rubato"]
dataset = [
  "dep:thiserror",
  "dep:ndarray",
  "dep:rand",
  "dep:rand_distr",
  "dep:rand_xoshiro",
  "dep:hdf5",
  "dep:rayon",
  "dep:crossbeam-channel",
  "dep:serde_json",
  "dep:serde",
  "dep:hound",
  "dep:rubato",
  "dep:roots",
  "dep:log",
  "dep:anyhow",
]
timings = []
logging = ["dep:log", "dep:crossbeam-channel"]
vorbis = ["dep:lewton", "dep:ogg"]
flac = ["dep:claxon"]
bin = [
  "dep:clap",
  "dep:anyhow",
  "dep:ctrlc",
  "dep:env_logger",
  "dep:rand",
  "dep:rust-ini",
  "logging",
]
wav-utils = ["dep:ndarray", "dep:hound"]
use-jemalloc = ["dep:jemallocator"]
tract = [
  "transforms",
  "logging",
  "dep:tract-core",
  "dep:tract-onnx",
  "dep:tract-pulse",
  "dep:tract-hir",
  "dep:rust-ini",
  "dep:ndarray",
  "dep:anyhow",
  "dep:flate2",
  "dep:tar",
]
# Opt-in GPU backends. Linking one registers it with tract's runtime inventory,
# which makes the "gpu-or-cpu" / "gpu" runtime names resolve to it. The default
# runtime stays "cpu" either way -- see DEFAULT_RUNTIME in src/tract.rs.
gpu-metal = ["tract", "dep:tract-metal"] # macOS/iOS only, no-op elsewhere
gpu-cuda = ["tract", "dep:tract-cuda"]   # Linux/Windows only, no-op elsewhere
default-model = [] # Include default DFN3 model
default-model-ll = [] # Include default DFN3 low latency model
nightly-features = []
capi = ["tract", "default-model", "dep:ndarray", "logging"]
wasm = [
  "tract",
  "default-model",
  "dep:ndarray",
  "dep:wasm-bindgen",
  "dep:getrandom",
  "dep:getrandom_v04",
  "dep:console_error_panic_hook",
  "dep:js-sys",
]
hdf5-static = ["hdf5?/static"]

[dependencies]
rustfft = "^6.1.0"
realfft = "^3.1.0"
itertools = "0.12"
num-complex = { version = "^0.4", features = ["serde"] }
log = { version = "0.4", features = ["std"], optional = true }
rand = { version = "0.8", optional = true, features = ["small_rng"] }
rubato = { version = "0.14", optional = true }
roots = { version = "0.0.7", optional = true }
rand_xoshiro = { version = "0.6", optional = true }
thiserror = { version = "1.0", optional = true }
anyhow = { version = "1.0", optional = true, features = ["backtrace"] }
ctrlc = { version = "3.2", optional = true }
hound = { version = "3.4", optional = true }
hdf5 = { package = "hdf5-metno", version = "0.14", optional = true }
ndarray = { version = "^0.17", optional = true, features = ["serde"] }
rand_distr = { version = "^0.4", optional = true }
rayon = { version = "1.5", optional = true }
crossbeam-channel = { version = "^0.5", optional = true }
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
lewton = { version = "^0.10", optional = true }
ogg = { version = "^0.8", optional = true }
claxon = { version = "^0.4", optional = true }
env_logger = { version = "0.11", optional = true }
clap = { version = "4.0", optional = true, features = ["derive"] }
rust-ini = { version = "^0.21", optional = true }
tract-core = { version = "^0.23.5", optional = true }
tract-onnx = { version = "^0.23.5", optional = true }
tract-pulse = { version = "^0.23.5", optional = true }
tract-hir = { version = "^0.23.5", optional = true }
flate2 = { version = "1.0.24", optional = true }
tar = { version = "0.4.38", optional = true }
wasm-bindgen = { version = "0.2.87", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }
# tract 0.23 pulls getrandom 0.4 transitively (tract-onnx-opl -> rand 0.10). On
# wasm32-unknown-unknown that major needs its "wasm_js" backend feature turned on,
# and features unify per package version, so declaring the edge here enables it for
# tract-onnx-opl too. Not referenced from source.
getrandom_v04 = { package = "getrandom", version = "0.4", features = ["wasm_js"], optional = true }
console_error_panic_hook = { version = "0.1.1", optional = true }
js-sys = { version = "0.3", optional = true }


# Optional GPU backends, gated to the targets where they can exist at all:
# tract-metal pulls in metal/objc (Apple only), tract-cuda pulls in cudarc
# (no CUDA for armv7 or riscv64, hence the arch bound). Neither feature is on by
# default, so the release matrix is unaffected regardless; the gates only mean
# that enabling one on a target it cannot serve is a no-op rather than a build
# failure. wasm32 matches neither.
#
# tract-cuda uses cudarc's "dynamic-loading", so it compiles with no CUDA
# toolkit present and its check() fails cleanly at runtime, which is what lets
# "gpu-or-cpu" fall back to the CPU on a machine with no CUDA driver.
#
# Pinned with "=" because both declare exact-version deps on tract-core.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
tract-metal = { version = "=0.23.5", optional = true }

[target.'cfg(all(any(target_os = "linux", target_os = "windows"), any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tract-cuda = { version = "=0.23.5", optional = true }

[target.'cfg(all(not(windows), not(target_os = "android"), not(target_os = "macos"), not(target_os = "freebsd"), not(target_env = "musl"), not(target_arch = "riscv64")))'.dependencies]
jemallocator = { version = "0.5.0", optional = true }

[dev-dependencies]
rand = "0.8"
rstest = "0.19"
env_logger = "0.11"
log = { version = "0.4", features = ["std"] }

[package.metadata.capi.header]
name = "deep_filter"
subdirectory = "deep_filter"
[package.metadata.capi.pkg_config]
name = "libdeepfilter"
filename = "deepfilter"
[package.metadata.capi.library]
name = "deepfilter"

[package.metadata.deb]
assets = [
  [
    "LICENSE-MIT",
    "usr/share/doc/deep_filter/",
    "644",
  ],
  [
    "LICENSE-APACHE",
    "usr/share/doc/deep_filter/",
    "644",
  ],
]
